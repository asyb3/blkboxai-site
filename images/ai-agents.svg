<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Intro to AI agents: a profile whose skull is circuitry, in the site's black, white and greys. Original drawing for blackbox. -->
  <defs>
    <clipPath id="head">
      <path id="skull" d="M590 140C680 140 745 190 760 280C764 305 770 325 772 340C770 355 762 362 764 372C780 410 808 450 818 470C822 482 808 490 790 490C782 492 780 500 786 512C792 522 790 530 780 534L770 538C784 544 786 560 772 568C762 574 760 584 766 600C772 622 762 648 735 656C705 664 690 664 680 672C672 710 676 760 684 800L500 800C496 750 480 700 452 660C400 600 372 520 376 430C380 280 470 150 590 140Z"/>
    </clipPath>
  </defs>
  <rect width="1200" height="900" fill="#f3f3f3"/>

  <!-- the head, black like the box -->
  <use href="#skull" fill="#0a0a0a"/>

  <g clip-path="url(#head)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- a seam just inside the skull -->
    <path d="M412 560C394 500 394 420 410 360C440 250 520 178 610 166" stroke="#3a3a3a" stroke-width="3"/>
    <!-- the chip -->
    <rect x="470" y="250" width="100" height="100" rx="10" stroke="#6b6b6b" stroke-width="4"/>
    <rect x="497" y="277" width="46" height="46" rx="4" stroke="#e8e8e8" stroke-width="3"/>
    <circle cx="520" cy="300" r="9" fill="#e8e8e8" stroke="none"/>
    <!-- traces out of the chip -->
    <g stroke="#6b6b6b" stroke-width="4">
      <path d="M570 270H612L652 230V200"/>
      <path d="M570 300H628L668 340V430"/>
      <path d="M570 330H600L630 360V470"/>
      <path d="M520 250V210L556 174"/>
      <path d="M495 250V196"/>
      <path d="M470 290H436L414 312V380"/>
      <path d="M470 320H446V420L464 438"/>
      <path d="M545 350V384L520 409"/>
      <path d="M500 250V232L470 202H448"/>
      <path d="M470 270H454L428 244"/>
      <path d="M486 504H466V600L484 618"/>
      <path d="M590 410H612L632 390"/>
    </g>
    <g stroke="#e8e8e8" stroke-width="2.5">
      <path d="M570 285H620L660 245"/>
      <path d="M470 305H430"/>
      <path d="M545 205L580 170"/>
    </g>
    <g fill="#0a0a0a" stroke="#e8e8e8" stroke-width="3">
      <circle cx="652" cy="196" r="8"/><circle cx="668" cy="434" r="8"/><circle cx="630" cy="474" r="8"/>
      <circle cx="559" cy="171" r="7"/><circle cx="495" cy="192" r="7"/><circle cx="414" cy="384" r="8"/>
      <circle cx="467" cy="441" r="6"/>
      <circle cx="444" cy="202" r="6"/><circle cx="425" cy="241" r="6"/><circle cx="487" cy="621" r="6"/>
    </g>
    <!-- a field of contacts at the back of the head -->
    <g fill="#4a4a4a">
      <rect x="420" y="470" width="8" height="8"/><rect x="436" y="470" width="8" height="8"/><rect x="452" y="470" width="8" height="8"/>
      <rect x="420" y="486" width="8" height="8"/><rect x="436" y="486" width="8" height="8"/><rect x="452" y="486" width="8" height="8"/>
      <rect x="420" y="502" width="8" height="8"/><rect x="436" y="502" width="8" height="8"/><rect x="452" y="502" width="8" height="8"/>
      <rect x="436" y="518" width="8" height="8"/><rect x="452" y="518" width="8" height="8"/><rect x="452" y="534" width="8" height="8"/>
    </g>
    <!-- the ear: a lens -->
    <circle cx="540" cy="478" r="60" fill="#0a0a0a" stroke="#e8e8e8" stroke-width="5"/>
    <circle cx="540" cy="478" r="42" stroke="#6b6b6b" stroke-width="4"/>
    <circle cx="540" cy="478" r="22" fill="#6b6b6b" stroke="none"/>
    <circle cx="540" cy="478" r="8" fill="#e8e8e8" stroke="none"/>
    <!-- traces down the neck, out of the head -->
    <g stroke="#6b6b6b" stroke-width="4">
      <path d="M520 538V600L540 620V820"/>
      <path d="M560 538V640L580 660V820"/>
      <path d="M600 520L620 540V820"/>
      <path d="M500 600V650L520 670V820"/>
      <path d="M640 600V820"/>
      <path d="M660 640V820"/>
    </g>
    <!-- the face: a white mask with a grey rim -->
    <path d="M684 100C640 250 600 420 622 540C636 610 670 650 720 668L900 700V100Z" fill="#ffffff" stroke="none"/>
    <path d="M684 100C640 250 600 420 622 540C636 610 670 650 720 668" stroke="#bdbdbd" stroke-width="10"/>
  </g>

  <!-- features, drawn in single lines -->
  <g fill="none" stroke="#0a0a0a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M714 366C734 354 756 351 774 357" stroke-width="5"/>
    <path d="M718 400C734 386 752 384 766 392" stroke-width="4"/>
    <path d="M722 402C736 412 752 412 764 400" stroke-width="2.5"/>
    <path d="M790 478C797 483 804 482 808 476" stroke-width="3.5"/>
    <path d="M770 538C777 538 783 537 788 534" stroke-width="3.5"/>
  </g>
  <circle cx="743" cy="398" r="7" fill="#0a0a0a"/>

  <!-- the traces leave the neck and end in contacts -->
  <g fill="none" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 798V846"/><path d="M540 798V826L556 842V872"/><path d="M580 798V860"/>
    <path d="M620 798V834L604 850V880"/><path d="M640 798V842"/><path d="M660 798V822L676 838V866"/>
  </g>
  <g fill="#0a0a0a">
    <circle cx="520" cy="852" r="7"/><circle cx="556" cy="878" r="7"/><circle cx="580" cy="866" r="7"/>
    <circle cx="604" cy="886" r="7"/><circle cx="676" cy="872" r="7"/>
  </g>
  <circle cx="640" cy="849" r="7" fill="#f3f3f3" stroke="#0a0a0a" stroke-width="3"/>
</svg>
